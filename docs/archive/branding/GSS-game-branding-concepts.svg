<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><rect width="1200" height="1100" fill="#fff"/><rect width="1200" height="9" fill="#0043fd"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="63" font-size="14" letter-spacing="2" font-weight="700" fill="#0043fd">GSS / GAME IDENTITY EXPLORATIONS</text><text x="58" y="120" font-size="40" font-weight="700" letter-spacing="-1" fill="#0c063f">Three ways to name the discovery.</text><text x="60" y="156" font-size="18" fill="#516178">Original vector concepts in the GSS blue palette. Current game branding remains unchanged.</text><path d="M58 178H1142" stroke="#d8e1ee"/><text x="60" y="214" font-size="13" font-weight="700" letter-spacing="1.5" fill="#516178">01 / CLEAR &amp; EDUCATIONAL</text><g transform="translate(60 251) scale(1.2)"><rect x="6" y="6" width="25" height="25" rx="3" fill="#0c063f"/><rect x="36" y="6" width="25" height="25" rx="3" fill="#0c063f"/><rect x="66" y="6" width="25" height="25" rx="3" fill="#0043fd"/><rect x="6" y="36" width="25" height="25" rx="3" fill="#0c063f"/><rect x="6" y="66" width="25" height="25" rx="3" fill="#0c063f"/><rect x="36" y="66" width="25" height="25" rx="3" fill="#0c063f"/><rect x="66" y="66" width="25" height="25" rx="3" fill="#0043fd"/><rect x="66" y="36" width="25" height="25" rx="3" fill="#00a9f2"/><rect x="44" y="36" width="25" height="25" rx="3" fill="#0043fd"/></g><text x="219" y="310" font-size="57" font-weight="700" letter-spacing="-1.4" fill="#0c063f">Gene Mosaic</text><text x="222" y="352" font-size="22" fill="#516178">Connect the pieces. Discover the biology.</text><text x="222" y="410" font-size="17" fill="#516178">The clearest fit for an image puzzle. A tiled G turns small discoveries into a coherent picture.</text><path d="M58 458H1142" stroke="#d8e1ee"/><text x="60" y="494" font-size="13" font-weight="700" letter-spacing="1.5" fill="#516178">02 / QUIET &amp; ACADEMIC</text><g transform="translate(60 531) scale(1.2)"><path d="M15 37V14H38M62 14H85V37M85 63V86H62M38 86H15V63" stroke="#0c063f" stroke-width="9" fill="none" stroke-linecap="square"/><rect x="35" y="35" width="30" height="30" rx="4" fill="#0043fd"/><circle cx="50" cy="50" r="6" fill="white"/></g><text x="219" y="590" font-size="57" font-weight="700" letter-spacing="-1.4" fill="#0c063f">Locus</text><text x="222" y="632" font-size="22" fill="#516178">Genetics, piece by piece.</text><text x="222" y="690" font-size="17" fill="#516178">The most understated academic direction. A framed point evokes a place in the genome.</text><path d="M58 738H1142" stroke="#d8e1ee"/><text x="60" y="774" font-size="13" font-weight="700" letter-spacing="1.5" fill="#516178">03 / CLEVER &amp; APPROACHABLE</text><g transform="translate(60 811) scale(1.2)"><path d="M14 12H51V24C65 16 76 27 68 40H81V72H52V84C37 91 29 80 36 68H14Z" fill="#0043fd"/><circle cx="57" cy="47" r="20" fill="white" stroke="#0c063f" stroke-width="7"/><path d="M72 63L91 84" stroke="#0c063f" stroke-width="8" stroke-linecap="round"/></g><text x="219" y="870" font-size="57" font-weight="700" letter-spacing="-1.4" fill="#0c063f">Gene &amp; Seek</text><text x="222" y="912" font-size="22" fill="#516178">Follow the clues. Find the connection.</text><text x="222" y="970" font-size="17" fill="#516178">The most playful name. A search lens and puzzle shape echo the hidden-gene reveal.</text><path d="M60 1045H1140" stroke="#d8e1ee"/><text x="60" y="1077" font-size="13" fill="#516178">Working concepts for Jimmy’s review. Palette: GSS royal blue, navy, and cyan.</text></g></svg>