<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"><title>Immune signal regulation</title><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#e9eef6" fill="none" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0043fd"/></marker></defs><rect width="800" height="600" fill="#fbfcff"/><rect width="800" height="600" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif"><rect x="28" y="24" width="38" height="30" rx="4" fill="#0043fd" stroke="#0043fd" stroke-width="2"/><text x="47" y="45" font-size="16" fill="white" text-anchor="middle" font-weight="700">09</text><text x="80" y="46" font-size="18" fill="#0c063f" text-anchor="start" font-weight="700">IMMUNE SIGNAL REGULATION</text><rect x="40" y="101" width="721" height="74" rx="12" fill="#eaf0ff" stroke="#c9d9e9" stroke-width="2"/><text x="69" y="132" font-size="22" fill="#0c063f" text-anchor="start" font-weight="700">Internal membrane signaling</text><text x="69" y="158" font-size="18" fill="#51647b" text-anchor="start" font-weight="500">Immune pathway → interferon response</text><text x="51" y="227" font-size="22" fill="#0c063f" text-anchor="start" font-weight="700">Regulated signal</text><text x="51" y="384" font-size="22" fill="#0c063f" text-anchor="start" font-weight="700">Sustained signal</text><path d="M56 306H741" stroke="#c9d9e9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M56 468H741" stroke="#c9d9e9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 290H159Q181 290 200 234Q221 195 242 253Q258 290 284 290H520" stroke="#167f91" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 450H158Q181 450 202 399L231 410L261 396L290 411L321 395L354 410L388 394L421 411L455 395L487 408L520 397" stroke="#0043fd" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M543 267L598 267" stroke="#0043fd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="621" y="227" width="133" height="71" rx="9" fill="#e4f4f7" stroke="#167f91" stroke-width="2"/><text x="687" y="258" font-size="18" fill="#0c063f" text-anchor="middle" font-weight="500">Response</text><text x="687" y="282" font-size="18" fill="#0c063f" text-anchor="middle" font-weight="500">settles</text><path d="M543 425L598 425" stroke="#0043fd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="621" y="388" width="133" height="76" rx="9" fill="#e8efff" stroke="#0043fd" stroke-width="2"/><text x="687" y="419" font-size="18" fill="#0c063f" text-anchor="middle" font-weight="500">Persistent</text><text x="687" y="444" font-size="17" fill="#0c063f" text-anchor="middle" font-weight="500">inflammation</text><text x="60" y="511" font-size="17" fill="#51647b" text-anchor="start" font-weight="500">Illustrative signal patterns; no numerical measurements</text><path d="M30 544H770" stroke="#c9d9e9" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="574" font-size="17" fill="#51647b" text-anchor="start" font-weight="500">Persistent signaling can sustain inflammation.</text><text x="770" y="593" font-size="11" fill="#51647b" text-anchor="end" font-weight="500">CONCEPTUAL SCHEMATIC · NOT TO SCALE</text></g></svg>